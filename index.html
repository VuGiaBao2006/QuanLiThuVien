<!DOCTYPE html>
<html>
<head>
    <title>Quản lý sách</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>QUẢN LÝ SÁCH</h1>

    <h2>Danh sách sách</h2>

    <input type="text" id="timKiem" placeholder="Nhập tên sách">

    <button onclick="timKiemSach()">Tìm kiếm</button>

    <button onclick="themSach()">Thêm sách</button>

    <div id="formSach">

        <input type="text" id="maSach" placeholder="Mã sách">

        <input type="text" id="tenSach" placeholder="Tên sách">

        <input type="text" id="tacGia" placeholder="Tác giả">

        <input type="text" id="theLoai" placeholder="Thể loại">

        <input type="number" id="soLuong" placeholder="Số lượng">

        <button onclick="luuSach()">Lưu sách</button>

    </div>

    <table id="bangSach">

        <tr>
            <th>Mã sách</th>
            <th>Tên sách</th>
            <th>Tác giả</th>
            <th>Thể loại</th>
            <th>Số lượng</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>

        <tr>
            <td>S001</td>
            <td>Lập trình Java</td>
            <td>Nguyễn Văn A</td>
            <td>Công nghệ thông tin</td>
            <td>10</td>
            <td>Còn sách</td>
            <td>
                <button onclick="suaSach(this)">Sửa</button>
                <button onclick="xoaSach(this)">Xóa</button>
            </td>
        </tr>

        <tr>
            <td>S002</td>
            <td>Cơ sở dữ liệu</td>
            <td>Trần Văn B</td>
            <td>Công nghệ thông tin</td>
            <td>5</td>
            <td>Còn sách</td>
            <td>
                <button onclick="suaSach(this)">Sửa</button>
                <button onclick="xoaSach(this)">Xóa</button>
            </td>
        </tr>

    </table>

    <script src="script.js"></script>

</body>
</html>
